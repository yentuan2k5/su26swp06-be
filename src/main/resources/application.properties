# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Optional SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=INFO

# ============================================================
# JWT
# The default below is a newly generated LOCAL-ONLY secret.
# Railway will override it through JWT_SECRET.
# ============================================================
jwt.secret=${JWT_SECRET:zs7/OJB+NxuElEnyj9E5+9OFg1nvf7tb+dIsWCc3hVSUng5iKgBE4pIZ8eWPIKXF}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Frontend / reset password
# ============================================================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.reset-token-expiry-minutes=15

# ============================================================
# Default admin account
# Change the local password before using shared environments.
# ============================================================
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@Local123456}

# ============================================================
# Google OAuth2
# Replace LOCAL_GOOGLE_CLIENT_SECRET with a newly rotated secret,
# or set the matching environment variable on your computer.
# Also add this redirect URI in Google Cloud Console:
# http://localhost:8080/login/oauth2/code/google
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:209323520443-am1ndlrqiopsb128rl5km1boukvg0nge.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:LOCAL_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE:openid,profile,email}
# Forwarded headers (safe locally and required behind Railway proxy)
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# ============================================================
# Brevo email
# Leave the key empty to start locally without sending email.
# Set BREVO_API_KEY to a newly rotated key to test forgot-password.
# ============================================================
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:sciencetrendhub@gmail.com}
brevo.from.name=${BREVO_FROM_NAME:Science Trend Hub}

# ============================================================
# OpenAlex
# Set OPENALEX_API_KEY to a newly rotated key before running sync.
# ============================================================
openalex.api.key=${OPENALEX_API_KEY:}
openalex.sync.queries=${OPENALEX_SYNC_QUERIES:computer science}
openalex.sync.limit=${OPENALEX_SYNC_LIMIT:20}

openalex.sync.overlap-days=${OPENALEX_SYNC_OVERLAP_DAYS:1}
openalex.backfill.max-results-per-concept=${OPENALEX_BACKFILL_MAX_RESULTS_PER_CONCEPT:5000}

trend.min-papers-threshold=${TREND_MIN_PAPERS_THRESHOLD:30}
trend.min-previous-papers-threshold=${TREND_MIN_PREVIOUS_PAPERS_THRESHOLD:5}
trend.min-recent-papers-for-emerging=${TREND_MIN_RECENT_PAPERS_FOR_EMERGING:30}
trend.excluded-keywords=${TREND_EXCLUDED_KEYWORDS:computer science}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
