# =========================================================
# SERVER CONFIG
# Railway sẽ tự cấp biến PORT.
# Nếu không có PORT thì mặc định chạy 8080.
# =========================================================
server.port=${PORT:8080}


# =========================================================
# DATABASE CONFIG - MYSQL CLOUD
# Backend sẽ lấy thông tin database từ Railway Variables.
# Không dùng localhost khi deploy cloud.
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver để Spring Boot kết nối MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE CONFIG
# update = Hibernate tự tạo/cập nhật bảng theo Entity
# Khi deploy lần đầu nên để update cho dễ tạo bảng.
# Sau khi ổn định có thể đổi thành none.
# =========================================================
spring.jpa.hibernate.ddl-auto=update

# In câu SQL ra terminal/log để dễ debug
spring.jpa.show-sql=true


# =========================================================
# JWT CONFIG
# JWT_SECRET: khóa bí mật để ký token
# JWT_EXPIRATION: thời gian sống access token, đơn vị ms
# 86400000 = 1 ngày
# JWT_REFRESH_EXPIRATION: thời gian sống refresh token
# 604800000 = 7 ngày
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# =========================================================
# DEFAULT ADMIN ACCOUNT
# Dùng cho DataInitializer tạo tài khoản admin mặc định.
# Lưu ý: 2 dòng này chỉ có tác dụng nếu trong code bạn đã có
# DataInitializer / CommandLineRunner tạo admin.
# =========================================================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}


# =========================================================
# FRONTEND URL
# Link frontend Vercel.
# Dùng cho reset password link, redirect, hoặc CORS nếu code có dùng.
# =========================================================
app.frontend.url=${FRONTEND_URL}


# =========================================================
# MAIL CONFIG - FORGOT PASSWORD
# Nếu chưa dùng chức năng gửi mail thì có thể để trống.
# MAIL_PASSWORD nên là Gmail App Password, không phải mật khẩu Gmail thường.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# GOOGLE LOGIN CONFIG
# Nếu chưa dùng login Google thì có thể để trống.
# =========================================================
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}