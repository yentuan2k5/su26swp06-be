# App name
spring.application.name=scientific-journal-tracker

# Railway sẽ tự cấp PORT
server.port=${PORT:8080}

# MySQL Database - dùng biến môi trường, không dùng localhost khi deploy
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:30}
spring.jpa.properties.hibernate.order_inserts=${HIBERNATE_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${HIBERNATE_ORDER_UPDATES:true}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Frontend URL - link Vercel
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173/}
# Origin được phép gọi API khi dùng credentials. Production nên là chính xác domain Vercel.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.reset-token-expiry-minutes=15

# Google OAuth2
server.forward-headers-strategy=framework
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}

# Mail config
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Admin account
app.admin.enabled=${APP_ADMIN_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# spring.mail.from=sciencetrendhub@gmail.com
# spring.mail.properties.mail.smtp.starttls.required=true
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# spring.mail.properties.mail.smtp.connectiontimeout=5000
# spring.mail.properties.mail.smtp.timeout=5000
brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}
brevo.from.name=${BREVO_FROM_NAME:Science Trend Hub}
openalex.api.key=${OPENALEX_API_KEY:}
openalex.sync.field-ids=${OPENALEX_SYNC_FIELD_IDS:17}
openalex.sync.limit=${OPENALEX_SYNC_LIMIT:100}
openalex.sync.overlap-days=${OPENALEX_SYNC_OVERLAP_DAYS:1}
openalex.backfill.max-results-per-concept=${OPENALEX_BACKFILL_MAX_RESULTS_PER_CONCEPT:20000}
openalex.backfill.request-timeout-seconds=${OPENALEX_BACKFILL_REQUEST_TIMEOUT_SECONDS:60}
openalex.backfill.retry-max-attempts=${OPENALEX_BACKFILL_RETRY_MAX_ATTEMPTS:3}
openalex.backfill.notifications.enabled=${OPENALEX_BACKFILL_NOTIFICATIONS_ENABLED:true}
openalex.backfill.notifications.max-new-papers=${OPENALEX_BACKFILL_NOTIFICATIONS_MAX_NEW_PAPERS:50}

trend.min-papers-threshold=${TREND_MIN_PAPERS_THRESHOLD:30}
trend.min-previous-papers-threshold=${TREND_MIN_PREVIOUS_PAPERS_THRESHOLD:5}
trend.min-recent-papers-for-emerging=${TREND_MIN_RECENT_PAPERS_FOR_EMERGING:30}
trend.excluded-keywords=${TREND_EXCLUDED_KEYWORDS:computer science}

# Rate limit cho endpoint dễ bị lạm dụng. Áp dụng theo từng instance backend.
security.rate-limit.login.max-requests=${SECURITY_RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
security.rate-limit.login.window-seconds=${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
security.rate-limit.password-reset.max-requests=${SECURITY_RATE_LIMIT_PASSWORD_RESET_MAX_REQUESTS:3}
security.rate-limit.password-reset.window-seconds=${SECURITY_RATE_LIMIT_PASSWORD_RESET_WINDOW_SECONDS:900}
security.rate-limit.backfill.max-requests=${SECURITY_RATE_LIMIT_BACKFILL_MAX_REQUESTS:1}
security.rate-limit.backfill.window-seconds=${SECURITY_RATE_LIMIT_BACKFILL_WINDOW_SECONDS:300}
security.rate-limit.sync.max-requests=${SECURITY_RATE_LIMIT_SYNC_MAX_REQUESTS:1}
security.rate-limit.sync.window-seconds=${SECURITY_RATE_LIMIT_SYNC_WINDOW_SECONDS:60}
